name: Package and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve latest stable library releases
        run: python3 .github/scripts/resolve-stable-externals.py .pkgmeta "$RUNNER_TEMP/pkgmeta-stable.yaml"

      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          args: -m "${{ runner.temp }}/pkgmeta-stable.yaml"
